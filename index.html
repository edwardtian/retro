<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games - Retro Game Playground</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/lib/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/local.css">
</head>
<body class="local-site">
    <header id="local-nav"></header>

    <main class="local-page">
        <div class="local-toolbar">
            <input type="search" id="game-search" class="form-control form-control-sm" style="max-width:260px"
                   placeholder="Search..." aria-label="Search games">
            <div class="btn-group btn-group-sm" role="group" aria-label="Filter by platform">
                <button type="button" class="btn btn-outline-secondary active" data-os="all">All</button>
                <button type="button" class="btn btn-outline-secondary" data-os="windows">Windows</button>
                <button type="button" class="btn btn-outline-secondary" data-os="dos">DOS</button>
            </div>
            <div class="d-flex align-items-center gap-1 ms-auto">
                <span class="local-subtle">Sort:</span>
                <a href="#" class="local-sort-link active" data-sort="title">Title</a>
                <a href="#" class="local-sort-link" data-sort="year">Year</a>
                <a href="#" class="local-sort-link" data-sort="played">Recently played</a>
            </div>
        </div>

        <div id="game-grid" class="row g-3"></div>
        <div id="empty-state" class="empty-state" hidden>No game matches the current filter.</div>
        <nav id="game-pagination" class="d-flex align-items-center gap-2 mt-3" hidden aria-label="Game list pages"></nav>
    </main>

    <script src="/lib/jquery/jquery.min.js"></script>
    <script src="/lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/catalog.js"></script>
    <script src="/js/local-site.js"></script>
    <script src="/js/game-list.js"></script>
</body>
</html>
